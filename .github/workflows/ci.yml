name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (build config)
        run: npm run typecheck

      - name: Type-check (tests)
        run: npm run typecheck:test

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
