<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>blog-component — local playground</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        line-height: 1.5;
        color: #1a1a1a;
      }
      body {
        margin: 0;
        padding: 2rem;
        max-width: 920px;
        margin-inline: auto;
      }
      h1 {
        margin-top: 0;

      .playground__intro {

        border-radius: 8px;
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
      }
      .playground__panel {
        margin-top: 2.5rem;
        border-top: 2px solid #dfe3e6;
        padding-top: 1.5rem;
      }

        cursor: pointer;
      }

  <body>
    <h1>blog-component playground</h1>
    <p class="playground__intro">

    <div id="app"></div>
    <script type="module" src="/dev/main.ts"></script>
